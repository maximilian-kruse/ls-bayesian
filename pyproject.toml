[project]
authors = [{name = "Maximilian Kruse", email = "maxkruse1604@gmail.com"}]
maintainers = [{name = "Maximilian Kruse", email = "maxkruse1604@gmail.com"}]
description = "A Minimal Toolbox for Large-Scale Bayesian Inverse Problems"
dependencies = ["eikonax>=0.4.2,<0.5"]
name = "ls-bayesian"
requires-python = ">= 3.14"
dynamic = ["version"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/ls_bayesian/_version.py"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ls_bayesian = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
beartype = ">=0.22.9,<0.23"
numpy = ">=2.5.3,<3"
python-gmsh = ">=4.15.2,<5"
meshio = ">=5.3.5,<6"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.16.7,<0.17"
pre-commit = ">=4.6.2,<5"
jupyter = ">=1.1.1,<2"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
pyvista = ">=0.48.4,<0.49"
trame = ">=4.0.0,<5"
trame-vtk = ">=2.11.16,<3"
trame-vuetify = ">=3.2.6,<4"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
pytest-mock = ">=3.15.1,<4"
nbclient = ">=0.11.0,<0.12"
nbformat = ">=5.11.1,<6"

[tool.pixi.feature.prior.dependencies]
fenics-dolfinx = ">=0.11.0,<0.12"
scifem = ">=0.22.1,<0.23"

[tool.pixi.environments]
default = { solve-group = "default" }
prior = { features = ["prior"], solve-group = "default" }
dev = { features = ["dev", "prior"], solve-group = "default" }
test = { features = ["dev", "test", "prior"], solve-group = "default" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TID252",  # relative imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-v",
  "--import-mode=importlib",
]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: tests with long runtime",
  "spde_prior_parallel: spde_prior tests requiring several MPI processes, run via `mpirun -n 2 python -m pytest -m spde_prior_parallel -p no:cacheprovider`",
]
