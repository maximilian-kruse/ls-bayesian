# ==================================================================================================
# Build System
# ==================================================================================================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"


# ==================================================================================================
# Project Metadata
# ==================================================================================================

[project]
name = "ls-bayesian"
dynamic = ["version"]
description = "A Minimal Toolbox for Large-Scale Bayesian Inverse Problems"
authors = [{ name = "Maximilian Kruse", email = "maxkruse1604@gmail.com" }]
maintainers = [{ name = "Maximilian Kruse", email = "maxkruse1604@gmail.com" }]
requires-python = ">= 3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []


# ==================================================================================================
# Hatch (Build & Versioning)
# ==================================================================================================

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.hooks.vcs]
version-file = "src/ls_bayesian/_version.py"


# ==================================================================================================
# Pixi (Environment Management)
# ==================================================================================================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

# --- Base dependencies ----------------------------------------------------------------------------

[tool.pixi.dependencies]
beartype = ">=0.22.9,<0.23"
numpy = ">=2.5.3,<3"
scipy = ">=1.18.1,<2"

[tool.pixi.pypi-dependencies]
ls_bayesian = { path = ".", editable = true }

# --- Features -------------------------------------------------------------------------------------

[tool.pixi.feature.prior.dependencies]
fenics-dolfinx = ">=0.11.0,<0.12"
scifem = ">=0.22.1,<0.23"

[tool.pixi.feature.mcmc.dependencies]
zarr = ">=3.4.0,<4"

[tool.pixi.feature.dev.dependencies]
ruff = ">=0.16.7,<0.17"
pre-commit = ">=4.6.2,<5"
jupyter = ">=1.1.1,<2"
pandas = ">=3.0.5,<4"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
pyvista = ">=0.48.4,<0.49"
meshio = ">=5.3.5,<6"
python-gmsh = ">=4.15.2,<5"
trame = ">=4.0.0,<5"
trame-vtk = ">=2.11.16,<3"
trame-vuetify = ">=3.2.6,<4"

[tool.pixi.feature.test.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
pytest-xdist = ">=3.8.0,<4"
pytest-mock = ">=3.15.1,<4"
nbclient = ">=0.11.0,<0.12"
nbformat = ">=5.11.1,<6"

# --- Environments ---------------------------------------------------------------------------------

[tool.pixi.environments]
default = { solve-group = "default" }
prior = { features = ["prior"], solve-group = "default" }
mcmc = { features = ["mcmc"], solve-group = "default" }
dev = { features = ["dev", "prior", "mcmc"], solve-group = "default" }
test = { features = ["dev", "test", "prior", "mcmc"], solve-group = "default" }

# --- Tasks ----------------------------------------------------------------------------------------

[tool.pixi.tasks]


# ==================================================================================================
# Ruff (Linting & Formatting)
# ==================================================================================================

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # flake8-bugbear
  "SIM",    # flake8-simplify
  "TID252", # flake8-tidy-imports: relative imports
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# ==================================================================================================
# Pytest
# ==================================================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-v",
  "--import-mode=importlib",
]
markers = [
  "unit: unit tests",
  "integration: integration tests",
  "slow: tests with long runtime",
  "parallel: tests requiring several MPI processes, run via `mpirun -n 2 python -m pytest -m parallel -p no:cacheprovider`",
]
